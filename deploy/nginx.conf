worker_processes 2;  # proxying is I/O-bound; each extra worker only costs memory
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;  # docker DNS: spread across replicas
    client_max_body_size 100m;
    access_log off;

    map $http_x_client_id $missing_client_id {
        ""      1;
        default 0;
    }

    # --- DoS protection: per client IP and per customer (X-Client-ID) ---------------------
    # WebSocket clients may send the customer id as ?client_id= instead of the header.
    map $http_x_client_id $client_key {
        ""      $arg_client_id;
        default $http_x_client_id;
    }
    # Only uploads (POST /jobs) are rate limited; an empty key is never counted.
    map $request_method $upload_ip {
        POST    $binary_remote_addr;
        default "";
    }
    map $request_method $upload_client {
        POST    $client_key;
        default "";
    }
    limit_req_zone  $upload_ip     zone=upload_rate_ip:10m     rate=10r/s;
    limit_req_zone  $upload_client zone=upload_rate_client:10m rate=10r/s;
    limit_conn_zone $upload_ip     zone=upload_conn_ip:10m;
    limit_conn_zone $upload_client zone=upload_conn_client:10m;
    limit_conn_zone $binary_remote_addr zone=stream_conn_ip:10m;
    limit_conn_zone $client_key         zone=stream_conn_client:10m;
    limit_req_status  429;
    limit_conn_status 503;

    # `resolve` (nginx >= 1.27.3) re-resolves through the resolver above, so restarted or
    # scaled containers (new IPs) are picked up without reloading nginx.
    upstream ingest { zone ingest 64k; server ingest-api:8000 resolve; keepalive 32; }
    upstream stream { zone stream 64k; server stream-gateway:8000 resolve; keepalive 32; }
    upstream eval   { zone eval 64k;   server eval-api:8000 resolve;       keepalive 16; }
    limit_req_zone $binary_remote_addr zone=eval_rate_ip:10m rate=20r/s;

    server {
        listen 80;
        default_type application/json;

        location = /healthz { return 200 '{"ok":true}'; }

        error_page 429 = @too_many_requests;
        error_page 503 = @too_many_connections;
        location @too_many_requests {
            add_header Retry-After 1 always;
            return 429 '{"detail":"too many requests"}';
        }
        location @too_many_connections {
            add_header Retry-After 5 always;
            return 503 '{"detail":"too many concurrent connections"}';
        }

        # Server-sent events: never buffer, long reads.
        location ~ ^/jobs/[^/]+/stream$ {
            if ($missing_client_id) { return 400 '{"detail":"X-Client-ID header is required"}'; }
            limit_conn stream_conn_ip 50;
            limit_conn stream_conn_client 50;
            proxy_pass http://stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # WebSocket (browsers cannot set headers; the gateway also accepts ?client_id=).
        location ~ ^/jobs/[^/]+/ws$ {
            limit_conn stream_conn_ip 50;
            limit_conn stream_conn_client 50;
            proxy_pass http://stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }

        # Evaluation: CPU-bound, small JSON bodies.
        location = /evaluate {
            limit_req zone=eval_rate_ip burst=40 nodelay;
            client_max_body_size 5m;
            proxy_pass http://eval;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Uploads stream straight through to the ingest API (no request buffering).
        location /jobs {
            if ($missing_client_id) { return 400 '{"detail":"X-Client-ID header is required"}'; }
            # Uploads: 10/s per IP and per customer (bursts of 20 allowed), 10 at a time each.
            limit_req  zone=upload_rate_ip burst=20 nodelay;
            limit_req  zone=upload_rate_client burst=20 nodelay;
            limit_conn upload_conn_ip 10;
            limit_conn upload_conn_client 10;
            proxy_pass http://ingest;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
